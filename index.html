function stemFor(html,num){
  const plain=html.replace(/<br>/g,' ').replace(/<[^>]+>/g,'').replace(/\{(\d+)b\}/g,'____');
  const marked=plain.replace(new RegExp('\\{'+num+'\\}'),'@@T@@').replace(/\{(\d+)\}/g,'____');
  const idx=marked.indexOf('@@T@@');
  let st=0;const re=/[.?!]\s/g;let m;while((m=re.exec(marked))&&m.index<idx)st=m.index+2;
  const rest=marked.slice(idx);const m2=rest.match(/[.?!](\s|$)/);const en=m2?idx+m2.index+1:marked.length;
  return marked.slice(st,en).replace('@@T@@','('+num+') {}');
}

    {num:6,opts:['After','Before','Though','When'],ans:'When',exp:'「她還是個孩子的時候」是時間點，用 When。',topic:'when / before / after'},
    {num:7,opts:['so','but','because','×'],ans:'but',exp:'貓大約 11 歲，但她只有 4 歲，前後語意轉折，用 but，前面加逗號。',topic:'although / but'},
    {num:8,opts:['happy','careful','proud','sorry'],ans:'sorry',exp:'貓離家出走再也沒回來，她為牠感到難過：feel sorry for it。',topic:'閱讀理解'},
    {num:9,opts:['after','because','though','when'],ans:'because',exp:'她覺得動物到外面危險的原因是可能會受傷，用 because 引導原因。',topic:'because / so'}]);
  k=0;const L3t=(q,ans,exp)=>write(s,'L3 A++ 翻譯 '+(++k),q,ans,exp,'翻譯');
  L3t('今天早上奶奶買了一輛新的腳踏車給我。',combos(['My {g} bought me a new {b} this morning.','My {g} bought a new {b} for me this morning.','This morning, my {g} bought me a new {b}.','This morning, my {g} bought a new {b} for me.'],{g:['grandmother','grandma'],b:['bicycle','bike']}),'buy 可用句型 1（bought me a new bicycle）或句型 2（bought a new bicycle for me）；this morning 是時間副詞。');
  L3t('當李先生在湖邊遇到他朋友時，他很高興。',combos(['Mr. Lee was {v}happy when he met his {f} {p} the lake.','When Mr. Lee met his {f} {p} the lake, he was {v}happy.'],{v:['very ',''],f:['friend','friends'],p:['by','near','beside']}),'when 子句放句首後面要加逗號；兩個子句都是過去式：met（meet 的過去式）與 was。');
  L3t('在吃這些三明治之前，請先洗手。',['Please wash your hands before eating these sandwiches.','Please wash your hands before you eat these sandwiches.','Before eating these sandwiches, please wash your hands.','Before you eat these sandwiches, please wash your hands.'],'before 後面可接動名詞（before eating）或子句（before you eat）；放句首時後面要加逗號。');
  L3t('因為我們的英語老師教我們許多英文歌，所以我們喜歡英文課。',combos(['Because our English teacher taught us {m} English songs, we like {c}.','We like {c} because our English teacher taught us {m} English songs.'],{m:['a lot of','many','lots of'],c:['English class','English classes','the English class']}),'because 與 so 只能用一個，這裡用 because；taught 是 teach 的過去式；because 子句放句首後面要加逗號。');
  L3t('雖然媽媽昨晚很晚睡，今天早上她還是很早起床。',combos(['Although {m} slept late last night, she still {v} early {t}.'],{m:['Mom','my mom','my mother','Mother'],v:['got up','woke up'],t:['this morning','today']}),'although 子句放句首後面加逗號，不能再加 but；slept、got up / woke up 都是過去式，因為說的是今天早上已經發生的事。');
  return S;
})();

const MINI_ROUNDS=[
  [['a'],'寫出動詞過去式'],
  [['b'],'肯定句與否定句'],
  [['c'],'Yes/No 問句與簡答'],
  [['d'],'Wh- 問句'],
  [['e'],'現在簡單式與過去簡單式'],
  [['f','g'],'第1課 Mini-Tests 選擇題'],
  [['h'],'第1課 A++ 選擇、克漏字、翻譯'],
  [['k'],'第3課 Mini-Tests 選擇題（一）'],
  [['l'],'第3課 Mini-Tests 選擇題（二）'],
  [['m'],'第3課 A++ 選擇、克漏字、翻譯']
];
function miniParts(random){
  const out=[];
  const mk=(k,title,items,lesson)=>({id:'F-'+k,unit:'F',no:'M'+k,lesson,title,topic:'MiniTest',
    ins:random?'MiniTest 全部題目<b>隨機打散</b>，每回 10 個題目。填空與翻譯用<b>鍵盤輸入</b>；<b>整段克漏字視為一大題</b>。每題右上角的標籤是原書位置。':'MiniTest 依課本順序整理。填空與翻譯用<b>鍵盤輸入</b>（翻譯題請打出完整句子）；<b>整段克漏字視為一大題</b>，一起作答。每題右上角的標籤是原書位置。',
    kind:'mixed',items});
  if(!random){
    MINI_ROUNDS.forEach((r,i)=>{
      const items=[];let lessons=new Set();
      r[0].forEach(id=>{MINI[id].items.forEach(x=>items.push(x));lessons.add(MINI[id].lesson);});
      out.push(mk(i+1,'MiniTest 第 '+(i+1)+' 回：'+r[1],items,Array.from(lessons).join('＋')));
    });
  }else{
    const all=[];MINI_ROUNDS.forEach(r=>r[0].forEach(id=>MINI[id].items.forEach(x=>all.push(x))));
    const sh=shuffle(all.slice());
    for(let i=0;i<sh.length;i+=10){const k=out.length+1;out.push(mk(k,'MiniTest 隨機 第 '+k+' 回',sh.slice(i,i+10),'第1課＋第3課'));}
  }
  return out;
}
